[project]
name = "video-gen"
version = "0.1.0"
description = "Reference-guided video generation with Wan2.1-VACE (1.3B on Apple MPS, 14B GGUF on a Colab T4)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@main",
    "transformers>=5.0",
    "gguf>=0.10.0",
    "spandrel>=0.4",
    "accelerate>=1.2",
    "ftfy>=6.2",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "Pillow>=10.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
conv3d = ["mps-conv3d"]

[project.scripts]
video-gen = "video_gen.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/video_gen"]
